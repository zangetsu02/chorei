<!-- Source for assets/logo.png. Re-render with:
     rsvg-convert -w 512 assets/logo.svg -o assets/logo.png -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0c0f1e"/>
      <stop offset="55%"  stop-color="#151b32"/>
      <stop offset="100%" stop-color="#2a2238"/>
    </linearGradient>
    <radialGradient id="dawn" cx="50%" cy="100%" r="70%">
      <stop offset="0%"   stop-color="#f0ad73" stop-opacity="0.75"/>
      <stop offset="38%"  stop-color="#d07f55" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#d07f55" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" gradientUnits="userSpaceOnUse" x1="56" y1="0" x2="456" y2="0">
      <stop offset="0%"   stop-color="#f0ad73" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#f0ad73" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f0ad73" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="104" fill="url(#sky)"/>
  <ellipse cx="256" cy="470" rx="232" ry="112" fill="url(#dawn)"/>
  <line x1="56" y1="400" x2="456" y2="400" stroke="url(#rule)" stroke-width="3"/>

  <text x="256" y="310" text-anchor="middle"
        font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif"
        font-size="176" font-weight="300" fill="#f5f2ec" letter-spacing="4">朝礼</text>
</svg>
